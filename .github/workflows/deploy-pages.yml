# Publishes the repo root as a static site to GitHub Pages.
# One-time setup: Repo → Settings → Pages → Build: GitHub Actions (not "Deploy from a branch").
name: Deploy GitHub Pages

on:
  push:
    branches:
      - claude/build-email-blasts-WXMYH

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site (HTML only)
        run: |
          mkdir -p _site
          cp index.html _site/
          cp blast-*.html _site/
          if [ -f newsletter.html ]; then cp newsletter.html _site/; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
